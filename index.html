<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Melissa Tinoco López — Portfolio</title>
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./hero.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./_ds_bundle.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg-page); }

  /* Scroll-reveal */
  .mt-reveal { opacity: 0; transform: translateY(28px); transition: opacity var(--dur-reveal) var(--ease-out), transform var(--dur-reveal) var(--ease-out); }
  .mt-reveal.is-visible { opacity: 1; transform: translateY(0); }

  /* Projects carousel (coverflow). Every slide shares one grid cell, so the
     stage is as tall as the tallest card; data-offset places each one. */
  .mt-carousel { --slide-w: min(560px, 86vw); }
  .mt-carousel__stage { display: grid; justify-items: center; perspective: 1800px; }
  .mt-carousel__slide {
    grid-area: 1 / 1;
    width: var(--slide-w);
    transition: transform 0.9s var(--ease-out), opacity 0.9s var(--ease-out), filter 0.9s var(--ease-out);
  }
  .mt-carousel__slide > a { height: 100%; }
  .mt-carousel__slide[data-offset='0']  { transform: none; z-index: 3; }
  .mt-carousel__slide[data-offset='1']  { transform: translateX(62%) scale(0.8) rotateY(-28deg); z-index: 2; opacity: 0.5; filter: brightness(0.6); cursor: pointer; }
  .mt-carousel__slide[data-offset='-1'] { transform: translateX(-62%) scale(0.8) rotateY(28deg); z-index: 2; opacity: 0.5; filter: brightness(0.6); cursor: pointer; }
  .mt-carousel__slide[data-offset='2'],
  .mt-carousel__slide[data-offset='-2'] { transform: scale(0.6); z-index: 1; opacity: 0; pointer-events: none; }
  .mt-carousel__slide:not([data-offset='0']):hover { opacity: 0.75; }

  .mt-carousel__controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: var(--space-7); }
  .mt-carousel__arrow {
    width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); cursor: pointer;
    transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
  }
  .mt-carousel__arrow:hover { background: var(--grad-pink); border-color: transparent; }
  .mt-carousel__dots { display: flex; gap: 10px; }
  .mt-carousel__dot {
    width: 10px; height: 10px; padding: 0; border-radius: 999px; border: none; cursor: pointer;
    background: var(--border-strong); transition: width var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
  }
  .mt-carousel__dot[aria-current='true'] { width: 32px; background: var(--grad-pink); }

  @media (max-width: 760px) {
    .mt-carousel__slide[data-offset='1']  { transform: translateX(78%) scale(0.82) rotateY(-24deg); }
    .mt-carousel__slide[data-offset='-1'] { transform: translateX(-78%) scale(0.82) rotateY(24deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mt-carousel__slide { transition: opacity 0.3s linear; }
  }

  .mt-menu-btn { display: none; }
  @media (min-width: 881px) {
    .mt-mobile-nav { display: none !important; }
    /* The hero has its own menu on desktop: hide the global nav until scrolling */
    .mt-nav[data-at-top='true'] { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  }
  @media (max-width: 880px) {
    .mt-navlinks { display: none !important; }
    .mt-menu-btn { display: inline-flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mt-reveal { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./icons.jsx" type="text/babel" data-presets="react"></script>
<script src="./data.jsx" type="text/babel" data-presets="react"></script>
<script src="./Nav.jsx" type="text/babel" data-presets="react"></script>
<script src="./Hero.jsx" type="text/babel" data-presets="react"></script>
<script src="./About.jsx" type="text/babel" data-presets="react"></script>
<script src="./Work.jsx" type="text/babel" data-presets="react"></script>
<script src="./Contact.jsx" type="text/babel" data-presets="react"></script>
<script src="./App.jsx" type="text/babel" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<window.PortfolioApp />);
</script>
</body>
</html>
